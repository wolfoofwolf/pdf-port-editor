<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 連接埠標註編輯器 - 複雜平面圖強制版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif; }
        .port-block { transition: box-shadow 0.1s ease; }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center">
                    <span class="text-white text-xl">📍</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold">PDF 連接埠標註編輯器</h1>
                    <p class="text-xs text-emerald-600">複雜平面圖強制處理版 v3</p>
                </div>
            </div>
            <div class="flex items-center gap-x-2">
                <button onclick="forceLowQualityMode()" class="px-3 py-1.5 text-xs bg-orange-500 text-white rounded-xl">強制低品質模式</button>
                <button onclick="showHelp()" class="px-3 py-1.5 text-xs border rounded-xl">說明</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-5">
        <div class="flex gap-5 h-[calc(100vh-7rem)]">
            
            <!-- 工具箱（已縮小） -->
            <div class="w-56 bg-white rounded-3xl border p-4 flex flex-col">
                <h2 class="font-bold text-lg mb-3">工具箱</h2>
                
                <div class="space-y-2">
                    <button onclick="addBlock('data')" class="w-full flex items-center gap-2 px-3 py-2 bg-yellow-300 border-2 border-black rounded-2xl text-sm">
                        <div class="w-6 h-6 bg-yellow-400 border border-black rounded-xl flex items-center justify-center"><span class="font-bold text-xs">D</span></div>
                        <span class="font-bold">Data Port</span>
                    </button>
                    <button onclick="addBlock('cctv')" class="w-full flex items-center gap-2 px-3 py-2 bg-orange-300 border-2 border-black rounded-2xl text-sm">
                        <div class="w-6 h-6 bg-orange-400 border border-black rounded-xl flex items-center justify-center"><span class="font-bold text-xs">C</span></div>
                        <span class="font-bold">CCTV Port</span>
                    </button>
                    <button onclick="addBlock('printer')" class="w-full flex items-center gap-2 px-3 py-2 bg-blue-300 border-2 border-black rounded-2xl text-sm">
                        <div class="w-6 h-6 bg-blue-400 border border-black rounded-xl flex items-center justify-center"><span class="font-bold text-xs">P</span></div>
                        <span class="font-bold">Printer Port</span>
                    </button>
                    <button onclick="addBlock('ap')" class="w-full flex items-center gap-2 px-3 py-2 bg-green-300 border-2 border-black rounded-2xl text-sm">
                        <div class="w-6 h-6 bg-green-400 border border-black rounded-xl flex items-center justify-center"><span class="font-bold text-xs">A</span></div>
                        <span class="font-bold">AP Port</span>
                    </button>
                </div>

                <div class="mt-auto pt-4 border-t">
                    <div class="text-xs text-gray-500 mb-1">即時統計</div>
                    <div class="bg-gray-50 rounded-2xl p-3 text-sm space-y-1">
                        <div class="flex justify-between"><span>總數</span><span id="total-count" class="font-mono font-bold">0</span></div>
                        <div class="flex justify-between text-xs"><span class="text-yellow-700">Data</span><span id="data-count">0</span></div>
                        <div class="flex justify-between text-xs"><span class="text-orange-700">CCTV</span><span id="cctv-count">0</span></div>
                        <div class="flex justify-between text-xs"><span class="text-blue-700">Printer</span><span id="printer-count">0</span></div>
                        <div class="flex justify-between text-xs"><span class="text-green-700">AP</span><span id="ap-count">0</span></div>
                    </div>
                </div>
            </div>

            <!-- 主視窗 -->
            <div class="flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-x-2">
                        <div class="flex bg-white border rounded-2xl">
                            <button onclick="prevPage()" class="px-3 py-1 text-sm">←</button>
                            <div class="px-4 py-1 border-x font-mono text-sm" id="page-info">1 / 1</div>
                            <button onclick="nextPage()" class="px-3 py-1 text-sm">→</button>
                        </div>
                        <div class="flex bg-white border rounded-2xl text-xs">
                            <button onclick="changeScale(0.7)" class="px-2 py-1">低</button>
                            <button onclick="changeScale(0.85)" class="px-2 py-1 bg-blue-100">中</button>
                            <button onclick="changeScale(1.2)" class="px-2 py-1">高</button>
                        </div>
                    </div>
                    <button onclick="exportPDF()" class="px-5 py-2 bg-emerald-600 text-white text-sm rounded-2xl">下載 PDF</button>
                </div>

                <div class="flex-1 bg-gray-200 rounded-3xl p-4 flex items-center justify-center overflow-auto" id="viewer-wrapper">
                    <div id="placeholder" class="text-center">
                        <div class="text-6xl mb-3">📄</div>
                        <p class="text-lg font-semibold">上傳複雜平面圖</p>
                        <button onclick="document.getElementById('file-input').click()" class="mt-4 px-6 py-2 bg-white border rounded-2xl text-sm">選擇 PDF</button>
                    </div>
                    <div id="viewer-container" class="relative hidden border bg-white rounded-2xl overflow-hidden">
                        <canvas id="pdf-canvas"></canvas>
                        <div id="overlay" class="absolute top-0 left-0 w-full h-full"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" class="hidden" accept=".pdf" onchange="handleFileUpload(event)">
    
    <div id="loading" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[999]">
        <div class="bg-white px-8 py-6 rounded-3xl text-center">
            <div class="w-9 h-9 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <div class="font-bold">正在強制處理複雜平面圖...</div>
            <div class="text-xs text-gray-500 mt-1">請耐心等待，可能需要較長時間</div>
        </div>
    </div>

    <script>
        let pdfDoc = null, pdfLibDoc = null, currentPage = 1, totalPages = 1;
        let scale = 0.85;
        let placedBlocks = [];
        let counters = { data: 1, cctv: 1, printer: 1, ap: 1 };

        function init() {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');

            try {
                const buffer = await file.arrayBuffer();
                
                // 強制優化參數處理複雜 PDF
                const loadingTask = pdfjsLib.getDocument({
                    data: buffer,
                    disableFontFace: true,
                    useWorkerFetch: false,
                    cMapPacked: true
                });
                
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                currentPage = 1;

                pdfLibDoc = await PDFLib.PDFDocument.load(buffer);

                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('viewer-container').classList.remove('hidden');
                document.getElementById('viewer-container').style.display = 'block';

                await renderCurrentPage();

                placedBlocks = [];
                counters = { data: 1, cctv: 1, printer: 1, ap: 1 };
                updateCounters();
                document.getElementById('overlay').innerHTML = '';

            } catch (err) {
                console.error(err);
                // 自動切換極低品質重試
                alert("載入失敗！正在自動切換極低品質模式重試...");
                scale = 0.65;
                await handleFileUpload(e); // 自動重試
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function renderCurrentPage() {
            if (!pdfDoc) return;
            const page = await pdfDoc.getPage(currentPage);
            const viewport = page.getViewport({ scale });
            const canvas = document.getElementById('pdf-canvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: ctx, viewport }).promise;

            const container = document.getElementById('viewer-container');
            container.style.width = `${viewport.width}px`;
            container.style.height = `${viewport.height}px`;
            document.getElementById('page-info').textContent = `${currentPage} / ${totalPages}`;
        }

        function addBlock(type) {
            if (!pdfDoc) return alert("請先上傳 PDF");
            // ... (原有 addBlock 邏輯，保持不變)
            // 為了篇幅省略，實際使用時請保留之前完整 addBlock、makeDraggable、exportPDF 等函數
        }

        function updateCounters() { /* 同之前 */ }
        function forceLowQualityMode() { scale = 0.6; if (pdfDoc) renderCurrentPage(); }
        function changeScale(s) { scale = s; if (pdfDoc) renderCurrentPage(); }
        function prevPage() { if (currentPage > 1) { currentPage--; renderCurrentPage(); } }
        function nextPage() { if (currentPage < totalPages) { currentPage++; renderCurrentPage(); } }

        // 其餘函數（makeDraggable、exportPDF、placedBlocks 處理等）請保留之前完整版本
        // 這裡只顯示核心優化部分

        window.onload = init;
    </script>
</body>
</html>
